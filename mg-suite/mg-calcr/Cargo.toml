[package]
name = "mg-calcr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe local calculator core and graph sampler"
license = "MIT"

[lib]
name = "mg_calcr"
path = "src/lib.rs"

[[bin]]
name = "mg-calcr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
