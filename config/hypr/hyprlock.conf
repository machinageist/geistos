general {
    hide_cursor = true
    ignore_empty_imput = true
    immidiate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

# Widgets #

background {
    # Placeholder: point this at your own lock wallpaper. The color below is
    # drawn when the file is absent, so an unset path degrades rather than fails.
    path = $HOME/pictures/wallpaper/lock-background.jpg
    color = rgba(25, 20, 25, 1.0)
    blur_passes = 2
}

image {
    # Placeholder avatar: set your own path, or delete this whole block
    path = $HOME/pictures/avatar.jpg
    size = 150
    rounding = -1
    position = 0, 150
    border_size = 2
    border_color = rgba(144, 0 , 236, 1.0)
    halign = center
    valign = center
}

shape {
    size = 225, 45
    color = rgba(0, 0, 0, 0.0) # no fill
    rounding = -1 # circle
    border_size = 2
    border_color = rgba(144, 0, 236, 1.0)

    position = 0, 45
    halign = center
    valign = center
}

label {
    text = ..::welcome|$USER::..
    color = rgba(200, 200, 200, 1.0)
    font_size = 12
    font_family = Mono

    position = 0, 45
    halign = center
    valign = center
}

input-field {
    size = 15%, 3%
    outline_thickness = 1
    outer_color = rgba(9933ffee) rgba(8800bbee) 45deg
    check_color = rgba(770099ee) rgba(7733aaee) 120deg
    fail_color = rgba(6633ffee) rgba(6600ffee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    font_family = Mono
    rounding = -1

    position = 0, -15
    halign = center
    valign = center
}

