general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

# Widgets #

background {
    # Placeholder: point this at your own lock wallpaper. The color below is
    # drawn when the file is absent, so an unset path degrades rather than fails.
        # Wallpaper.qml maintains this symlink when the active wallpaper changes.
    # The checked-in path remains a safe fallback for a fresh machine.
    path = ~/.cache/geistos-lock-wallpaper
    color = rgba(25, 20, 25, 1.0)
    blur_passes = 2
}

image {
    # Placeholder avatar: set your own path, or delete this whole block
    path = $HOME/pictures/avatar.jpg
    size = 150
    rounding = -1
    position = 0, 150
    border_size = 2
    border_color = rgba(144, 0 , 236, 1.0)
    halign = center
    valign = center
}

label {
    text = ..::welcome|$USER::..
    color = rgba(200, 200, 200, 1.0)
    font_size = 12
    font_family = Mono

    position = 0, 110
    halign = center
    valign = bottom
}

label {
    text = cmd[update:1000] sh -c 'a=${ATTEMPTS:-0}; r=$((3-a)); [ "$r" -lt 0 ] && r=0; now=$(date +%s); last=$(faillock --user "$USER" 2>/dev/null | tail -n 1); set -- $last; left=0; if [ -n "$1" ] && [ "$1" != "Valid" ]; then ts=$(date -d "$1 $2" +%s 2>/dev/null || echo 0); left=$((ts + 600 - now)); [ "$left" -lt 0 ] && left=0; fi; printf "Attempts remaining: %d | Cooldown remaining: %02d:%02d" "$r" "$((left/60))" "$((left%60))"'
    color = rgba(255, 255, 255, 1.0)
    font_size = 9
    font_family = Mono

    position = 0, 15
    halign = center
    valign = bottom
}

input-field {
    size = 15%, 3%
    outline_thickness = 1
    outer_color = rgba(0, 0, 0, 1.0)
    inner_color = rgba(0, 0, 0, 0.9)
    check_color = rgba(0, 0, 0, 1.0)
    fail_color = rgba(0, 0, 0, 1.0)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Mono
    rounding = -1

    position = 0, 50
    halign = center
    valign = bottom
}

