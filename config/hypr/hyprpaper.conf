# Placeholder wallpaper paths. The shell's wallpaper service scans
# ~/pictures/wallpaper and drives hyprpaper over IPC at runtime.
wallpaper {
  monitor = eDP-1
  path = ~/pictures/wallpaper/default.jpg
  fit_mode = cover
}

wallpaper {
  monitor = HDMI-A-1
  path = ~/pictures/wallpaper/default.jpg
  fit_mode = cover
}

splash = false
