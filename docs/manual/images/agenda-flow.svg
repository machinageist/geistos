<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
  </defs>
  <rect width="1000" height="330" fill="#ffffff"/>

  <!-- step boxes -->
  <g>
    <rect x="20" y="60" width="205" height="120" rx="12" fill="#fff4e6" stroke="#c2620a" stroke-width="2"/>
    <circle cx="48" cy="88" r="16" fill="#c2620a"/>
    <text x="48" y="94" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
    <text x="72" y="95" font-size="19" fill="#1f2430" font-weight="700">mg-remindr</text>
    <text x="40" y="132" font-size="15" fill="#5b6475">exports a snapshot</text>
    <text x="40" y="156" font-size="15" fill="#5b6475">of your reminders</text>
  </g>
  <line x1="225" y1="120" x2="268" y2="120" stroke="#5b6475" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="270" y="60" width="205" height="120" rx="12" fill="#f5f6f8" stroke="#9aa3b2" stroke-width="2"/>
    <circle cx="298" cy="88" r="16" fill="#5b6475"/>
    <text x="298" y="94" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
    <text x="322" y="95" font-size="19" fill="#1f2430" font-weight="700">Snapshot</text>
    <text x="290" y="132" font-size="15" fill="#5b6475">waits in a private</text>
    <text x="290" y="156" font-size="15" fill="#5b6475">temporary folder</text>
  </g>
  <line x1="475" y1="120" x2="518" y2="120" stroke="#5b6475" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="520" y="60" width="205" height="120" rx="12" fill="#fdf8e1" stroke="#a16207" stroke-width="2"/>
    <circle cx="548" cy="88" r="16" fill="#a16207"/>
    <text x="548" y="94" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
    <text x="572" y="95" font-size="19" fill="#1f2430" font-weight="700">mg-calr</text>
    <text x="540" y="132" font-size="15" fill="#5b6475">checks all of it, then</text>
    <text x="540" y="156" font-size="15" fill="#5b6475">swaps it in, all or nothing</text>
  </g>
  <line x1="725" y1="120" x2="768" y2="120" stroke="#5b6475" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="770" y="60" width="210" height="120" rx="12" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
    <circle cx="798" cy="88" r="16" fill="#0e7490"/>
    <text x="798" y="94" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
    <text x="822" y="95" font-size="19" fill="#1f2430" font-weight="700">Your agenda</text>
    <text x="790" y="132" font-size="15" fill="#5b6475">reads reminders only</text>
    <text x="790" y="156" font-size="15" fill="#5b6475">from the checked copy</text>
  </g>

  <!-- stores -->
  <g font-size="14">
    <path d="M70,222 a52,9 0 0,0 104,0 v34 a52,9 0 0,1 -104,0 z" fill="#ffffff" stroke="#c2620a" stroke-width="2"/>
    <ellipse cx="122" cy="222" rx="52" ry="9" fill="#fff4e6" stroke="#c2620a" stroke-width="2"/>
    <text x="122" y="290" text-anchor="middle" fill="#5b6475">remindr.sqlite</text>
    <line x1="122" y1="180" x2="122" y2="210" stroke="#c9ced8" stroke-width="2"/>

    <path d="M823,222 a52,9 0 0,0 104,0 v34 a52,9 0 0,1 -104,0 z" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
    <ellipse cx="875" cy="222" rx="52" ry="9" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
    <text x="875" y="290" text-anchor="middle" fill="#5b6475">todo-projection.json</text>
    <line x1="875" y1="180" x2="875" y2="210" stroke="#c9ced8" stroke-width="2"/>
  </g>

  <text x="500" y="30" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">Neither app ever opens the other's file</text>
  <text x="500" y="250" font-size="14" fill="#5b6475" text-anchor="middle">Runs by itself when you change a reminder in the panel.</text>
  <text x="500" y="272" font-size="14" fill="#5b6475" text-anchor="middle">After terminal changes: Geist panel → Refresh todo agenda.</text>
</svg>
